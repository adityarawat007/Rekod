# apps/extension is deliberately NOT a package: it has no build step and no
# dependencies, and Chrome loads everything under it. It sits in apps/ for
# layout only.
packages:
  - apps/web

allowBuilds:
  esbuild: true
  mongodb-memory-server: false
  unrs-resolver: true

# Transitive highs in next's own deps (postcss -> source-map-js, sharp) that
# next has not bumped yet; each pinned to the first patched release.
overrides:
  source-map-js: ^1.2.2
  sharp: ^0.35.5
