<!doctype html><meta charset="utf-8"><title>FlamJam</title>
<style>
  :root{--jam:#FF2D55;--zest:#FFC400;--bg:#1C1624;--s2:#241C2E;--line:#463A56;--ink:#F4EFF7;--ink3:#8B7E97}
  *{box-sizing:border-box}
  [hidden]{display:none!important}   /* author display:grid below outranks the UA sheet */
  body{margin:0;width:248px;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,sans-serif}
  header{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
  .brand{display:inline-flex;align-items:center;gap:7px;background:var(--jam);color:#fff;border-radius:100px;
         padding:4px 10px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .brand i{width:5px;height:5px;border-radius:50%;background:var(--zest)}
  .opts{display:grid;gap:8px;padding:0 14px 14px}
  button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--s2);
         border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);
         font:600 13px system-ui;cursor:pointer}
  button:hover{border-color:var(--jam)}
  button:focus-visible{outline:2px solid #A98BFF;outline-offset:2px}
  button small{display:block;font-weight:400;font-size:11px;color:var(--ink3);margin-top:1px}
  svg{flex:0 0 auto;color:var(--jam)}
  .hint{padding:0 14px 13px;font-size:10.5px;color:var(--ink3);font-family:ui-monospace,monospace}
  .err{padding:0 14px 13px;font-size:11px;color:#FF5C6E}
  button.primary{justify-content:center;background:var(--jam);border-color:var(--jam);color:#fff}
  .gate{display:grid;justify-items:center;text-align:center;gap:4px;padding:6px 18px 18px}
  .gate img{border-radius:50%;background:var(--s2);padding:8px;margin-bottom:8px}
  .gate h1{margin:0;font-size:15px;font-weight:700}
  .gate p{margin:0 0 12px;font-size:12px;color:var(--ink3)}
  .gate button{justify-content:center}
  .who{display:flex;align-items:center;gap:6px;padding:0 14px 12px;font-size:11px;color:var(--ink3)}
  .who span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
            font-family:ui-monospace,monospace}
  .who button{width:auto;padding:3px 8px;font-size:11px;background:none;border:none;color:var(--ink3);
              text-decoration:underline;cursor:pointer}
  .who button:hover{color:var(--ink)}
</style>
<header><span class="brand"><i></i> FlamJam</span></header>
<div class="gate" id="gate" hidden>
  <img src="icons/128.png" alt="" width="56" height="56">
  <h1>Your session has expired</h1>
  <p>Please log in to use FlamJam</p>
  <button class="primary" id="login">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M6.5 2.5h5a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-5"/><path d="M8.5 8h-7m4.5-3L9.5 8 6 11"/></svg>
    Log in
  </button>
</div>

<div class="opts" id="capture" hidden>
  <button id="rec">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="1.5" y="3" width="9.5" height="10" rx="2"/><path d="M11 7.2l3.5-2.2v6L11 8.8z"/></svg>
    <span>Record this tab<small>Up to 3 minutes</small></span>
  </button>
</div>
<div class="hint" id="hotkey" hidden>⌥⇧J records straight away</div>
<div class="who" id="who" hidden><span id="me"></span><button type="button" id="dash">Dashboard</button></div>
<div class="err" id="err" hidden></div>
<script src="auth.js"></script>
<script src="popup.js"></script>
