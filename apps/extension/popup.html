<!doctype html><meta charset="utf-8"><title>Rekod</title>
<style>
  /* Our own surface, so it wears the dashboard's light palette — zinc greys,
     hairline borders, a near-black primary — rather than the near-black the
     on-page bar needs to stand apart from whatever site it lands on. Colour is
     functional only: the red is the record light and errors, nothing else. */
  :root{--bg:#FFFFFF;--subtle:#F7F7F8;--fill:#F4F4F5;--fill2:#E9E9EC;--ink:#18181B;--muted:#71717A;
        --line:#E9E9EC;--line2:#E4E4E7;--ring:#A1A1AA;--rec:#DC2626;--crit:#DC2626}
  *{box-sizing:border-box}
  [hidden]{display:none!important}   /* author display:grid below outranks the UA sheet */
  body{margin:0;width:264px;background:var(--bg);color:var(--ink);letter-spacing:-.006em;
       -webkit-font-smoothing:antialiased;
       font:13px/1.4 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 10px;
         border-bottom:1px solid var(--line)}
  /* The mark is the thing the product does: a record light, then the name. */
  .brand{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:650;letter-spacing:-.02em}
  .brand img{width:20px;height:20px;border-radius:5px}
  .opts{display:grid;gap:6px;padding:12px 12px 10px}
  button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--bg);
         border:1px solid var(--line2);border-radius:10px;padding:9px 10px;color:var(--ink);
         font:inherit;font-weight:550;letter-spacing:-.006em;cursor:pointer;
         transition:background .12s,border-color .12s}
  button:hover{background:var(--subtle);border-color:#D4D4D8}
  button:active{background:var(--fill)}
  button:disabled{opacity:.55;cursor:default}
  button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
  button small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
  /* The icon sits in its own tile so the two choices scan as two rows, not as
     two paragraphs. */
  .opts button svg{box-sizing:content-box;padding:7px;border-radius:8px;background:var(--fill);color:var(--ink)}
  #rec svg{color:var(--rec)}
  /* The mic switch wears the same skin as the buttons above it: it belongs to
     the recording, not to a settings screen this popup does not have. */
  .toggle{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line2);
          border-radius:10px;padding:9px 10px;font-weight:550;cursor:pointer}
  .toggle span{flex:1}
  .toggle small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
  .toggle input{flex:0 0 auto;width:16px;height:16px;margin:0;accent-color:var(--ink);cursor:pointer}
  .toggle:has(input:focus-visible){outline:2px solid var(--ring);outline-offset:2px}
  svg{flex:0 0 auto}
  .hint{padding:0 14px 12px;font-size:11.5px;color:var(--muted)}
  .hint kbd{font:500 10.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink);
            background:var(--fill);border:1px solid var(--line2);border-radius:5px;padding:2px 5px;margin-right:2px}
  #busy{padding:14px}
  .err{margin:0 12px 12px;padding:8px 10px;border-radius:8px;font-size:12px;color:var(--crit);
       background:#FEF2F2;border:1px solid #FDE2E2}
  button.primary{justify-content:center;background:var(--ink);border-color:var(--ink);color:#fff;font-weight:550}
  button.primary:hover{background:#27272A;border-color:#27272A}
  /* Signed out, the gate's own mark is the brand; one is enough. */
  body:has(#gate:not([hidden])) header{display:none}
  .gate{display:grid;justify-items:center;text-align:center;gap:4px;padding:22px 16px 16px}
  .gate img{border-radius:12px;margin-bottom:10px}
  .gate h1{margin:0;font-size:14px;font-weight:650;letter-spacing:-.015em}
  .gate p{margin:0 0 14px;font-size:12px;color:var(--muted)}
  .gate button{justify-content:center}
  .who{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;font-size:11.5px;color:var(--muted);
       border-top:1px solid var(--line);background:var(--subtle)}
  .who span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who button{width:auto;flex:0 0 auto;gap:4px;padding:4px 8px;font-size:11.5px;font-weight:500;
              background:none;border:1px solid transparent;border-radius:7px;color:var(--ink)}
  .who button:hover{background:var(--fill2);border-color:transparent}
</style>
<header><span class="brand"><img src="icons/128.png" alt="">Rekod</span></header>
<div class="gate" id="gate" hidden>
  <img src="icons/128.png" alt="" width="44" height="44">
  <h1 id="gate-title"></h1>
  <p id="gate-note"></p>
  <button class="primary" id="login">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M6.5 2.5h5a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-5"/><path d="M8.5 8h-7m4.5-3L9.5 8 6 11"/></svg>
    <span id="gate-cta"></span>
  </button>
</div>

<div class="opts" id="capture" hidden>
  <button id="rec">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="1.5" y="3" width="9.5" height="10" rx="2"/><path d="M11 7.2l3.5-2.2v6L11 8.8z"/></svg>
    <span>Record this tab<small>Up to 3 minutes</small></span>
  </button>
  <button id="shot">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M1.5 5.5a1 1 0 0 1 1-1h1.8l1-1.7h4.4l1 1.7h1.8a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1z"/>
      <circle cx="8" cy="8.3" r="2.4"/></svg>
    <span>Screenshot this tab<small>Drag to pick the area</small></span>
  </button>
  <!-- The mic switch, off with the rest of the sound (AUDIO in offscreen.js).
       Uncomment this and the block in popup.js together — popup.js reads #mic
       at load, so one without the other is a popup that does not paint.
  <label class="toggle">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="5.7" y="1.5" width="4.6" height="8" rx="2.3"/><path d="M3.2 7.4a4.8 4.8 0 0 0 9.6 0M8 12.2v2.3"/></svg>
    <span>Record my microphone<small id="mic-note">Off — tab audio only</small></span>
    <input type="checkbox" id="mic">
  </label>
  -->
</div>
<div class="hint" id="hotkey" hidden><kbd>⌥⇧J</kbd> records straight away</div>
<div class="who" id="who" hidden><span id="me"></span><button type="button" id="dash">Dashboard<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 11l6-6M6 5h5v5"/></svg></button></div>
<div class="hint" id="busy">Checking your session…</div>
<div class="err" id="err" hidden></div>
<script src="auth.js"></script>
<script src="popup.js"></script>
