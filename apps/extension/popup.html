<!doctype html><meta charset="utf-8"><title>rekod</title>
<style>
  /* Our own surface, so it wears the dashboard's light palette — a grey
     canvas, white panels, hairline borders, midnight ink and an electric-blue
     primary — square everywhere but the dots. The electric gradient is the top
     band and nothing else (§2.4 lists it); inside, colour is functional: red is
     the record light and errors. No webfont: the popup opens offline too, so
     the stacks name the brand faces first and fall back to system. */
  :root{--bg:#ECECEC;--panel:#FFFFFF;--line:#DEDEE3;--line-strong:#8C8C98;
        --ink:#00022F;--muted:#4F4F5C;--faint:#6E6E78;
        --primary:#060CBE;--primary-hover:#0A12E0;--on-primary:#FFFFFF;
        --link:#060CBE;--focus:#060CBE;--tint:#C4C4F6;--error:#C8341F;--warning:#9A6400;--success:#2E7D3A;
        --chrome:#00022F;--on-chrome:#FFFFFF;--on-chrome-muted:#B4B6D6;
        /* A 4px checker over the sweep: the band reads slightly pixelated. */
        --gradient-electric:url("dusk.png") 0 0 / 100% 12px repeat-y,#142581;
        --font-sans:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;
        --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
  /* §2.3. Chrome (and the band) stay midnight in both. */
  @media (prefers-color-scheme:dark){
    :root{--bg:#07081C;--panel:#11132B;--line:#23264A;--line-strong:#4A4D78;
          --ink:#EEEEF6;--muted:#A6A8C2;--faint:#7A7D99;
          --primary:#4A50F0;--primary-hover:#5D63FF;--on-primary:#FFFFFF;
          --link:#9EA2FF;--focus:#9EA2FF;--tint:#2C2F6E;--error:#FF8A73;--warning:#F2C25A;--success:#6FCF8E}
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}   /* author display:grid below outranks the UA sheet */
  body{margin:0;width:264px;background:var(--bg);color:var(--ink);
       -webkit-font-smoothing:antialiased;font:13px/1.4 var(--font-sans)}
  .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 12px;
         background:var(--gradient-electric);image-rendering:pixelated;color:var(--on-chrome)}
  /* The wordmark: four pixels (2×2), then the name, lowercase. On the blue
     band the pixels are on-chrome so they don't vanish into it. */
  .brand{display:inline-flex;align-items:center;gap:8px;font:700 22px/1 var(--font-sans);letter-spacing:-.02em}
  .opts{display:grid;gap:8px;padding:12px}
  button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);
         border:1px solid var(--line-strong);border-radius:0;padding:9px 10px;color:var(--ink);
         font:inherit;font-weight:500;cursor:pointer;
         transition:background .12s,border-color .12s}
  button:hover{background:var(--bg);border-color:var(--ink)}
  button:active{background:var(--line)}
  button:disabled{opacity:.5;cursor:default}
  button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  button small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
  /* The icon sits in its own tile so the two choices scan as two rows, not as
     two paragraphs. */
  .opts button svg{box-sizing:content-box;padding:7px;border-radius:0;background:var(--bg);
                   border:1px solid var(--line);color:var(--ink)}
  #rec svg{color:var(--error)}
  /* The mic switch wears the same skin as the buttons above it: it belongs to
     the recording, not to a settings screen this popup does not have. */
  .toggle{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line-strong);
          border-radius:0;padding:9px 10px;font-weight:500;cursor:pointer;transition:background .12s,border-color .12s}
  .toggle:hover{background:var(--bg);border-color:var(--ink)}
  .toggle span{flex:1}
  .toggle small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
  .toggle input{flex:0 0 auto;width:16px;height:16px;margin:0;accent-color:var(--primary);cursor:pointer}
  .toggle:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
  svg{flex:0 0 auto}
  .hint{padding:0 14px 12px;font-size:11.5px;color:var(--muted)}
  .hint kbd{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);
            background:var(--panel);border:1px solid var(--line-strong);border-radius:0;padding:3px 5px;margin-right:2px}
  #busy{padding:14px}
  .err{margin:0 12px 12px;padding:8px 10px;border-radius:0;font-size:12px;color:var(--error);
       background:var(--panel);border:1px solid var(--error)}
  button.primary{justify-content:center;background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
  button.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
  /* Signed out, the gate's own mark is the brand; one is enough. */
  body:has(#gate:not([hidden])) header{display:none}
  .gate{display:grid;justify-items:center;text-align:center;gap:4px;padding:22px 16px 16px}
  .gate img{border-radius:0;margin-bottom:10px}
  .gate h1{margin:0;font-size:15px;font-weight:600;letter-spacing:-.015em}
  .gate p{margin:0 0 14px;font-size:12px;color:var(--muted)}
  .gate button{justify-content:center}
  .who{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;font:11px/1.4 var(--font-mono);color:var(--muted);
       border-top:1px solid var(--line);background:var(--panel)}
  .who span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who button{width:auto;flex:0 0 auto;gap:4px;padding:4px 8px;font:500 11.5px/1.4 var(--font-sans);
              min-height:32px;background:none;border:1px solid transparent;border-radius:0;color:var(--link)}
  .who button:hover{background:var(--bg);border-color:transparent;text-decoration:underline}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<header><span class="brand"><img src="icons/mark.svg" width="22" height="22" alt="">rekod</span></header>
<div class="gate" id="gate" hidden>
  <img src="icons/128.png" alt="" width="44" height="44">
  <h1 id="gate-title"></h1>
  <p id="gate-note"></p>
  <button class="primary" id="login">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7">
      <path d="M6.5 2.5h5a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1h-5"/><path d="M8.5 8h-7m4.5-3L9.5 8 6 11"/></svg>
    <span id="gate-cta"></span>
  </button>
</div>

<div class="opts" id="capture" hidden>
  <button id="rec">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="1.5" y="3" width="9.5" height="10" rx="2"/><path d="M11 7.2l3.5-2.2v6L11 8.8z"/></svg>
    <span>Record this tab<small>Up to 3 minutes</small></span>
  </button>
  <button id="shot">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M1.5 5.5a1 1 0 0 1 1-1h1.8l1-1.7h4.4l1 1.7h1.8a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1z"/>
      <circle cx="8" cy="8.3" r="2.4"/></svg>
    <span>Screenshot this tab<small>Drag to pick the area</small></span>
  </button>
  <!-- The mic switch, off with the rest of the sound (AUDIO in offscreen.js).
       Uncomment this and the block in popup.js together — popup.js reads #mic
       at load, so one without the other is a popup that does not paint.
  <label class="toggle">
    <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="5.7" y="1.5" width="4.6" height="8" rx="2.3"/><path d="M3.2 7.4a4.8 4.8 0 0 0 9.6 0M8 12.2v2.3"/></svg>
    <span>Record my microphone<small id="mic-note">Off — tab audio only</small></span>
    <input type="checkbox" id="mic">
  </label>
  -->
</div>
<div class="hint" id="hotkey" hidden><kbd>⌥⇧J</kbd> records straight away</div>
<div class="who" id="who" hidden><span id="me"></span><button type="button" id="dash">Dashboard<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 11l6-6M6 5h5v5"/></svg></button></div>
<div class="hint" id="busy">Checking your session…</div>
<div class="err" id="err" hidden></div>
<script src="auth.js"></script>
<script src="popup.js"></script>
